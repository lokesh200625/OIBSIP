<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temperature Converter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="converter">
    <h1>🌡️ Temperature Converter</h1>
    <p class="subtitle">Convert between Celsius, Fahrenheit and Kelvin</p>

    <div class="form-group">
      <label for="tempInput">Temperature Value</label>
      <input type="text" id="tempInput" placeholder="Enter a number, e.g. 25" inputmode="decimal" autocomplete="off">
      <p class="error" id="errorMsg" role="alert"></p>
    </div>

    <div class="form-group">
      <label for="unitSelect">Convert From</label>
      <select id="unitSelect">
        <option value="C">Celsius (°C)</option>
        <option value="F">Fahrenheit (°F)</option>
        <option value="K">Kelvin (K)</option>
      </select>
    </div>

    <button id="convertBtn" type="button">Convert</button>

    <div class="result" id="result" hidden>
      <h2>Results</h2>
      <div class="result-row"><span>Celsius</span><strong id="resC">-</strong></div>
      <div class="result-row"><span>Fahrenheit</span><strong id="resF">-</strong></div>
      <div class="result-row"><span>Kelvin</span><strong id="resK">-</strong></div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
